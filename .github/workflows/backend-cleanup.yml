name: Backend Cleanup

on:
  schedule:
    # Run cleanup every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  cleanup-docker:
    name: Cleanup Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Cleanup old Docker images
        run: |
          # Keep only the last 10 images
          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST -d '{"username": "${{ secrets.DOCKER_USERNAME }}", "password": "${{ secrets.DOCKER_PASSWORD }}"}' https://hub.docker.com/v2/users/login | jq -r .token)
          
          # Get all tags for the repository
          TAGS=$(curl -s -H "Authorization: JWT $TOKEN" "https://hub.docker.com/v2/repositories/playrke/backend/tags/?page_size=100" | jq -r '.results[].name')
          
          # Convert to array and sort, keeping only the last 10
          TAG_ARRAY=($TAGS)
          TAG_COUNT=${#TAG_ARRAY[@]}
          
          if [ $TAG_COUNT -gt 10 ]; then
            echo "Found $TAG_COUNT tags, removing $((TAG_COUNT - 10)) oldest tags"
            
            # Remove oldest tags (keeping last 10)
            for ((i=0; i<$((TAG_COUNT - 10)); i++)); do
              TAG="${TAG_ARRAY[$i]}"
              echo "Removing tag: $TAG"
              curl -X DELETE -H "Authorization: JWT $TOKEN" "https://hub.docker.com/v2/repositories/playrke/backend/tags/$TAG/"
            done
          else
            echo "Found $TAG_COUNT tags, no cleanup needed"
          fi

  cleanup-cache:
    name: Cleanup GitHub Cache
    runs-on: ubuntu-latest

    steps:
      - name: Cleanup old caches
        uses: actions/github-script@v7
        with:
          script: |
            const caches = await github.rest.actions.getCacheListForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - 7); // Keep caches for 7 days
            
            let deletedCount = 0;
            
            for (const cache of caches.data.actions_caches) {
              const cacheDate = new Date(cache.created_at);
              if (cacheDate < cutoffDate) {
                try {
                  await github.rest.actions.deleteActionsCacheById({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    cache_id: cache.id,
                  });
                  deletedCount++;
                  console.log(`Deleted cache: ${cache.key} (created: ${cache.created_at})`);
                } catch (error) {
                  console.error(`Failed to delete cache ${cache.key}:`, error.message);
                }
              }
            }
            
            console.log(`Cleanup completed. Deleted ${deletedCount} caches.`);
