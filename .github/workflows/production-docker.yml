name: Validación Docker de producción

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/Dockerfile.prod"
      - "backend/docker-compose.prod.yml"
      - "backend/deploy.sh"
      - ".github/workflows/production-docker.yml"
  push:
    branches: [master]
    paths:
      - "backend/Dockerfile.prod"
      - "backend/docker-compose.prod.yml"
      - "backend/deploy.sh"
      - ".github/workflows/production-docker.yml"

permissions:
  contents: read

concurrency:
  group: production-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validar Compose y construir imágenes de producción
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Validar sintaxis del script de despliegue
        run: bash -n backend/deploy.sh

      - name: Preparar entorno de prueba sin secretos reales
        run: |
          cat > backend/.env.prod <<'EOF'
          APP_NAME=PlayRKE
          APP_ENV=production
          APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_DEBUG=false
          APP_URL=https://playrke.invalid
          FRONTEND_URL=https://playrke.invalid
          APP_DOMAIN=playrke.invalid
          ACME_EMAIL=ci@playrke.invalid
          DB_CONNECTION=mysql
          DB_HOST=mysql
          DB_PORT=3306
          DB_DATABASE=playrke
          DB_USERNAME=playrke
          DB_PASSWORD=ci-db-password
          DB_ROOT_PASSWORD=ci-root-password
          CACHE_STORE=redis
          QUEUE_CONNECTION=redis
          SESSION_DRIVER=redis
          SESSION_SECURE_COOKIE=true
          LOG_LEVEL=error
          REDIS_HOST=redis
          REDIS_PASSWORD=ci-redis-password
          REDIS_PORT=6379
          REVERB_HOST=reverb
          REVERB_PORT=8080
          REVERB_SCHEME=http
          REVERB_APP_ID=123456
          REVERB_APP_KEY=ci-reverb-public-key
          REVERB_APP_SECRET=ci-reverb-secret
          REVERB_SERVER_HOST=0.0.0.0
          REVERB_SERVER_PORT=8080
          TURNSTILE_SITE_KEY=ci-turnstile-site
          TURNSTILE_SECRET_KEY=ci-turnstile-secret
          VITE_API_URL=https://playrke.invalid/api
          VITE_APP_NAME=PlayRKE
          VITE_REVERB_APP_KEY=ci-reverb-public-key
          VITE_REVERB_HOST=ws.playrke.invalid
          VITE_REVERB_PORT=443
          VITE_REVERB_SCHEME=https
          VITE_TURNSTILE_SITE_KEY=ci-turnstile-site
          EOF
          chmod 600 backend/.env.prod

      - name: Validar configuración Docker Compose
        working-directory: backend
        run: docker compose --env-file .env.prod -f docker-compose.prod.yml config --quiet

      - name: Construir PHP-FPM y Nginx de producción
        working-directory: backend
        run: docker compose --env-file .env.prod -f docker-compose.prod.yml build --progress plain php nginx
