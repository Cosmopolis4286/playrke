# Variables cargadas desde .env.dev en todos los servicios Laravel
# Arrancar con: docker compose -f docker-compose.dev.yml --env-file .env.dev up -d --build

services:

  # ─── Traefik — Proxy inverso ───────────────────────────────────────────────
  traefik:
    image: traefik:v3.1
    container_name: playrke_traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:7000"
      - "--entrypoints.ws.address=:6001"
      - "--log.level=WARN"
    ports:
      - "7000:7000"
      - "6001:6001"
      - "8888:8080"       # Panel Traefik → http://localhost:8888
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - playrke_network

  # ─── PHP-FPM — Aplicación Laravel ─────────────────────────────────────────
  # vendor queda dentro de la imagen — solo se montan los dirs que cambian
  # Sin puerto HTTP propio: nginx habla FastCGI con este servicio en :9000
  php:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: playrke_php
    command: >
      sh -c "
        php artisan migrate --force &&
        php artisan migrate --path=database/migrations/bingo --force &&
        php artisan migrate --path=database/migrations/trivia --force || true &&
        php artisan db:seed --force &&
        php-fpm
      "
    env_file: .env.dev
    environment:
      # off por defecto: Xdebug instrumenta cada request PHP-FPM aun sin
      # trigger activo cuando el modo incluye 'debug'/'coverage', agregando
      # ~1-2s de overhead por request. Para debuggear paso a paso, exportar
      # XDEBUG_MODE=debug antes de levantar el stack (o en .env.dev local).
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    volumes:
      - ./app:/var/www/app
      - ./bootstrap:/var/www/bootstrap
      - ./config:/var/www/config
      - ./database:/var/www/database
      - ./lang:/var/www/lang
      - ./resources:/var/www/resources
      - ./routes:/var/www/routes
      - ./tests:/var/www/tests
      - ./public:/var/www/public
      - ./artisan:/var/www/artisan
      - ./.env.dev:/var/www/.env
      - storage_data:/var/www/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Sin esto, nginx (depends_on: condition: service_healthy más abajo) no
    # tiene forma de saber cuándo php-fpm ya acepta conexiones FastCGI en
    # :9000 — el propio `command` de este servicio corre migrate/seed ANTES
    # de arrancar php-fpm, así que "el contenedor existe" (estado Running)
    # puede llegar segundos/minutos antes de que el puerto realmente escuche.
    # `nc -z` (netcat, ya viene en la imagen base php:8.4-fpm-alpine) confirma
    # el puerto abierto sin depender de php-fpm-healthcheck ni otra herramienta
    # externa.
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - playrke_network

  # ─── Nginx — Frontend HTTP para PHP-FPM ───────────────────────────────────
  # Traefik no habla FastCGI: nginx traduce HTTP -> FastCGI hacia php:9000
  nginx:
    image: nginx:1.27-alpine
    container_name: playrke_nginx
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.php.rule=Host(`playrke.localhost`) || Host(`localhost`)"
      - "traefik.http.routers.php.entrypoints=web"
      - "traefik.http.services.php.loadbalancer.server.port=8080"
    # condition: service_healthy (no solo "- php"): nginx resuelve el DNS del
    # upstream "php" UNA SOLA VEZ al arrancar (ver docker/nginx/app.conf) — si
    # el contenedor php existe pero migrate/seed todavía no terminó de correr
    # (puede tardar bastante en un `docker compose up` desde cero) o Docker
    # aún no le asignó IP en la red, nginx falla con "host not found in
    # upstream" y queda Exited para siempre, sin reintentar. depends_on con
    # "- php" a secas solo esperaba a que el contenedor EXISTIERA, no a que
    # estuviera listo — causa real de los crashes de nginx en este servicio.
    depends_on:
      php:
        condition: service_healthy
    # Red de seguridad adicional: si por cualquier motivo (timing de red,
    # reinicio parcial del daemon Docker) nginx igual fallara al arrancar,
    # que Docker lo reintente solo en vez de quedar Exited requiriendo un
    # `docker start` manual como pasó antes de este cambio.
    restart: unless-stopped
    networks:
      - playrke_network

  # ─── MySQL ─────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: playrke_mysql
    env_file: .env.dev
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --skip-log-bin
      --innodb-flush-log-at-trx-commit=2
      --innodb-flush-method=O_DIRECT
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - playrke_network

  # ─── PostgreSQL — Trivia ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: playrke_postgres
    environment:
      POSTGRES_DB: trivia
      POSTGRES_USER: trivia
      POSTGRES_PASSWORD: trivia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trivia -d trivia"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - playrke_network

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: playrke_redis
    command: >
      redis-server
      --appendonly no
      --save ""
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - playrke_network

  # ─── Reverb — WebSocket ────────────────────────────────────────────────────
  reverb:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: playrke_reverb
    command: ["php", "artisan", "reverb:start", "--debug", "--port=8080", "--host=0.0.0.0"]
    env_file: .env.dev
    ports:
      - "8082:8080"
    volumes:
      - ./app:/var/www/app
      - ./bootstrap:/var/www/bootstrap
      - ./config:/var/www/config
      - ./database:/var/www/database
      - ./lang:/var/www/lang
      - ./routes:/var/www/routes
      - ./.env.dev:/var/www/.env
      - storage_data:/var/www/storage
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.reverb.rule=Host(`ws.playrke.localhost`)"
      - "traefik.http.routers.reverb.entrypoints=ws"
      - "traefik.http.services.reverb.loadbalancer.server.port=8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - playrke_network

  # ─── Queue Worker ──────────────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: playrke_queue
    command: ["php", "artisan", "queue:work", "--queue=default,bingo-draw", "--sleep=1", "--tries=3", "--timeout=600", "--verbose"]
    env_file: .env.dev
    volumes:
      - ./app:/var/www/app
      - ./bootstrap:/var/www/bootstrap
      - ./config:/var/www/config
      - ./database:/var/www/database
      - ./lang:/var/www/lang
      - ./routes:/var/www/routes
      - ./.env.dev:/var/www/.env
      - storage_data:/var/www/storage
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - playrke_network

  # ─── Scheduler ─────────────────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: playrke_scheduler
    command: ["sh", "-c", "while true; do php artisan schedule:run --verbose; sleep 60; done"]
    env_file: .env.dev
    volumes:
      - ./app:/var/www/app
      - ./bootstrap:/var/www/bootstrap
      - ./config:/var/www/config
      - ./database:/var/www/database
      - ./lang:/var/www/lang
      - ./routes:/var/www/routes
      - ./.env.dev:/var/www/.env
      - storage_data:/var/www/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - playrke_network

  # ─── Mailpit — Captura de correos ──────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: playrke_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - playrke_network

volumes:
  mysql_data:
    driver: local
  postgres_data:
    driver: local
  storage_data:
    driver: local

networks:
  playrke_network:
    driver: bridge
