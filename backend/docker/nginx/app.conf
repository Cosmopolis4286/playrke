server {
    listen 8080;
    server_name _;
    root /var/www/public;
    index index.php;

    client_max_body_size 100M;

    # DNS interno de Docker (127.0.0.11), con TTL corto — sin esto,
    # `fastcgi_pass php:9000;` resolvería "php" UNA SOLA VEZ al arrancar este
    # worker y quedaría apuntando a esa IP para siempre; si el contenedor php
    # se reinicia (restart: unless-stopped, actualización, etc.) y Docker le
    # asigna otra IP en la red bridge, nginx seguiría enviando FastCGI a la IP
    # vieja hasta que alguien lo reinicie a mano. Con $upstream_php como
    # variable, nginx re-resuelve "php" en cada request usando este resolver.
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $upstream_php php:9000;
        fastcgi_pass $upstream_php;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        try_files $uri $uri/ /index.php?$query_string;
        expires 7d;
        access_log off;
    }
}
