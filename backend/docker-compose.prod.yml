# Variables cargadas desde .env.prod
# Arrancar con: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:

  # ─── Traefik — Proxy inverso + TLS automático Let's Encrypt ───────────────
  traefik:
    image: traefik:v3.1
    container_name: playrke_traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=ERROR"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - playrke_network
    restart: unless-stopped

  # ─── PHP-FPM ───────────────────────────────────────────────────────────────
  php:
    build:
      context: ..
      dockerfile: backend/Dockerfile.prod
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_APP_NAME: ${VITE_APP_NAME:-PlayRKE}
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
    container_name: playrke_php
    env_file: .env.prod
    volumes:
      - storage_public:/workspace/backend/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Healthcheck FastCGI para que Nginx espere a que PHP-FPM acepte conexiones.
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - playrke_network
    restart: unless-stopped

  # ─── Nginx — HTTP hacia el navegador y FastCGI hacia PHP-FPM ───────────────
  nginx:
    build:
      context: ..
      dockerfile: backend/Dockerfile.prod
      target: web
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_APP_NAME: ${VITE_APP_NAME:-PlayRKE}
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-443}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-https}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
    container_name: playrke_nginx
    volumes:
      - storage_public:/var/www/public/storage:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.nginx.entrypoints=websecure"
      - "traefik.http.routers.nginx.tls.certresolver=letsencrypt"
      - "traefik.http.services.nginx.loadbalancer.server.port=8080"
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - playrke_network
    restart: unless-stopped

  # ─── MySQL ─────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: playrke_mysql
    env_file: .env.prod
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - playrke_network
    restart: unless-stopped

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: playrke_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - playrke_network
    restart: unless-stopped

  # ─── Reverb — WebSocket ────────────────────────────────────────────────────
  reverb:
    build:
      context: ..
      dockerfile: backend/Dockerfile.prod
      target: production
    container_name: playrke_reverb
    command: ["php", "artisan", "reverb:start", "--port=8080", "--host=0.0.0.0"]
    env_file: .env.prod
    volumes:
      - storage_public:/workspace/backend/storage/app/public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.reverb.rule=Host(`ws.${APP_DOMAIN}`)"
      - "traefik.http.routers.reverb.entrypoints=websecure"
      - "traefik.http.routers.reverb.tls.certresolver=letsencrypt"
      - "traefik.http.services.reverb.loadbalancer.server.port=8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - playrke_network
    restart: unless-stopped

  # ─── Queue Worker (default) ────────────────────────────────────────────────
  # Colas generales. Separado del worker del sorteo: StartBingoDrawJob ocupa su
  # worker toda la partida (sleep entre fichas) y dejaba estas colas sin procesar.
  # Los reembolsos (bingo-refunds) tienen su propio worker más abajo.
  queue:
    build:
      context: ..
      dockerfile: backend/Dockerfile.prod
      target: production
    container_name: playrke_queue
    command: ["php", "artisan", "queue:work", "--queue=default", "--sleep=3", "--tries=3", "--timeout=600", "--max-time=3600"]
    env_file: .env.prod
    volumes:
      - storage_public:/workspace/backend/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - playrke_network
    restart: unless-stopped

  # ─── Queue Worker (bingo-draw) ─────────────────────────────────────────────
  # Worker dedicado al sorteo (StartBingoDrawJob): un job ocupa el worker toda la partida.
  queue-bingo-draw:
    build:
      context: ..
      dockerfile: backend/Dockerfile.prod
      target: production
    container_name: playrke_queue_bingo_draw
    command: ["php", "artisan", "queue:work", "--queue=bingo-draw", "--sleep=3", "--tries=3", "--timeout=600", "--max-time=3600"]
    env_file: .env.prod
    volumes:
      - storage_public:/workspace/backend/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - playrke_network
    restart: unless-stopped

  # ─── Bingo refunds — worker aislado para no bloquear los sorteos ───────────
  bingo-refunds:
    build:
      context: ..
      dockerfile: backend/Dockerfile.prod
      target: production
    container_name: playrke_bingo_refunds
    command: ["php", "artisan", "queue:work", "--queue=bingo-refunds", "--sleep=3", "--tries=3", "--timeout=120", "--max-time=3600"]
    env_file: .env.prod
    volumes:
      - storage_public:/workspace/backend/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - playrke_network
    restart: unless-stopped

  # ─── Scheduler ─────────────────────────────────────────────────────────────
  scheduler:
    build:
      context: ..
      dockerfile: backend/Dockerfile.prod
      target: production
    container_name: playrke_scheduler
    command: ["sh", "-c", "while true; do php artisan schedule:run; sleep 60; done"]
    env_file: .env.prod
    volumes:
      - storage_public:/workspace/backend/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - playrke_network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  letsencrypt:
    driver: local
  storage_public:
    driver: local

networks:
  playrke_network:
    driver: bridge
