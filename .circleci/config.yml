version: 2.1

jobs:
  backend-php:
    docker:
      - image: cimg/php:8.4
      - image: mysql:8.0
        name: mysql
        environment:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: playrke_testing
          MYSQL_USER: playrke_user
          MYSQL_PASSWORD: playrke_password
      - image: postgres:16-alpine
        name: postgres
        environment:
          POSTGRES_DB: trivia_testing
          POSTGRES_USER: trivia
          POSTGRES_PASSWORD: trivia
      - image: redis:7-alpine
        name: redis
    working_directory: ~/project
    environment:
      APP_ENV: testing
      APP_KEY: base64:FcQxhyCbxAt3FBAveGKcqDewGqGhjenOWyW4aFWFLP4=
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: playrke_testing
      DB_USERNAME: playrke_user
      DB_PASSWORD: playrke_password
      REVERB_APP_ID: test-app
      REVERB_APP_KEY: test-key
      REVERB_APP_SECRET: test-secret
      FRONTEND_URL: http://localhost:3000
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-php84-composer-{{ checksum "backend/composer.lock" }}
            - v1-php84-composer-
      - run:
          name: Install GMP system development library
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libgmp-dev
      - run:
          name: Install PHP extensions required by the backend
          command: |
            set -euo pipefail
            sudo -E install-php-extensions pdo_mysql pdo_pgsql gmp
            # Redis is compiled with igbinary serializer support, so its headers
            # must be installed before configuring the Redis extension.
            sudo -E install-php-extensions igbinary
            sudo -E install-php-extensions redis-6.2.0
            sudo -E docker-php-ext-enable igbinary redis
            php -m
      - run:
          name: Verify required PHP extensions and platform requirements
          command: |
            set -euo pipefail
            php -v
            php --ini
            php -r '
              $required = ["pdo_mysql", "pdo_pgsql", "gmp", "igbinary", "redis"];
              $missing = array_values(array_filter($required, fn ($extension) => ! extension_loaded($extension)));
              if ($missing !== []) {
                  fwrite(STDERR, "Missing PHP extensions: " . implode(", ", $missing) . PHP_EOL);
                  fwrite(STDERR, "Loaded extensions: " . implode(", ", get_loaded_extensions()) . PHP_EOL);
                  exit(1);
              }
              echo "Required PHP extensions loaded: " . implode(", ", $required) . PHP_EOL;
            '
            php --ri gmp
            php --ri igbinary
            php --ri redis
      - run:
          name: Install PHP dependencies
          command: |
            composer install --working-dir=backend --no-interaction --prefer-dist --no-progress --optimize-autoloader
            composer check-platform-reqs --working-dir=backend
      - save_cache:
          key: v1-php84-composer-{{ checksum "backend/composer.lock" }}
          paths:
            - backend/vendor
      - run:
          name: Prepare isolated test environment
          command: |
            cat > backend/.env.testing \<<'EOF'
            APP_NAME="PlayRKE"
            APP_ENV=testing
            APP_KEY=base64:FcQxhyCbxAt3FBAveGKcqDewGqGhjenOWyW4aFWFLP4=
            APP_DEBUG=true
            APP_URL=http://localhost:8000
            APP_TIMEZONE=America/Caracas
            APP_LOCALE=en
            APP_FALLBACK_LOCALE=en
            APP_FAKER_LOCALE=en_US
            SESSION_DRIVER=array
            SESSION_LIFETIME=120
            SESSION_ENCRYPT=false
            SANCTUM_STATEFUL_DOMAINS=localhost,localhost:8000,127.0.0.1,127.0.0.1:8000
            DB_CONNECTION=mysql
            DB_HOST=mysql
            DB_PORT=3306
            DB_DATABASE=playrke_testing
            DB_USERNAME=playrke_user
            DB_PASSWORD=playrke_password
            DB_TRIVIA_HOST=postgres
            DB_TRIVIA_PORT=5432
            DB_TRIVIA_DATABASE=trivia_testing
            DB_TRIVIA_USERNAME=trivia
            DB_TRIVIA_PASSWORD=trivia
            DB_TRIVIA_SCHEMA=public
            CACHE_STORE=array
            QUEUE_CONNECTION=sync
            BCRYPT_ROUNDS=4
            LOG_CHANNEL=stack
            LOG_STACK=single
            LOG_LEVEL=debug
            REDIS_CLIENT=phpredis
            REDIS_HOST=redis
            REDIS_PASSWORD=null
            REDIS_PORT=6379
            FILESYSTEM_DISK=local
            MAIL_MAILER=array
            MAIL_FROM_ADDRESS="test@playrke.local"
            MAIL_FROM_NAME="PlayRKE"
            BROADCAST_DRIVER=log
            BROADCAST_CONNECTION=log
            TELESCOPE_ENABLED=false
            EOF
      - run:
          name: Wait for test services
          command: |
            for service in "mysql 3306" "postgres 5432" "redis 6379"; do
              set -- $service
              host="$1"
              port="$2"
              ready=false
              for attempt in $(seq 1 120); do
                if getent hosts "$host" >/dev/null 2>&1 && (echo > "/dev/tcp/$host/$port") 2>/dev/null; then
                  ready=true
                  break
                fi
                sleep 2
              done
              if [ "$ready" != "true" ]; then
                echo "Service $host:$port did not become ready in time after 240 seconds."
                echo "DNS lookup for $host:"
                getent hosts "$host" || true
                exit 1
              fi
            done
      - run:
          name: Run PHPUnit suite
          command: cd backend && php artisan test
      - run:
          name: Check domain error translations
          command: cd backend && php artisan check:domain-error-translations
      - run:
          name: Lint changed PHP files with Pint
          command: |
            set -euo pipefail
            git fetch origin master --depth=1
            mapfile -t FILES < <(git diff --diff-filter=ACMRT --name-only origin/master...HEAD -- 'backend/**/*.php' | sed 's#^backend/##')
            if [ "${#FILES[@]}" -eq 0 ]; then
              echo "No changed PHP files compared with master; skipping Pint."
              exit 0
            fi
            printf 'PHP files checked by Pint:\n'
            printf ' - %s\n' "${FILES[@]}"
            cd backend
            ./vendor/bin/pint --test "${FILES[@]}"

  backend-assets:
    docker:
      - image: cimg/node:20.19
    resource_class: large
    working_directory: ~/project
    environment:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-pnpm-{{ checksum "pnpm-lock.yaml" }}
            - v1-pnpm-
      - run:
          name: Activate repository-pinned pnpm
          command: |
            corepack enable
            corepack prepare pnpm@10.25.0 --activate
            pnpm --version
      - run:
          name: Install JavaScript dependencies
          command: pnpm install --no-frozen-lockfile
      - save_cache:
          key: v1-pnpm-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
      - run:
          name: Build Vite assets
          command: pnpm --dir backend run build
      - run:
          name: Run frontend unit tests
          command: NODE_OPTIONS=--max-old-space-size=4096 pnpm --dir backend run test
      - run:
          name: Type-check Vue and TypeScript
          command: pnpm --dir backend run typecheck
      - run:
          name: Lint changed frontend files with ESLint
          command: |
            git fetch origin master --depth=1
            FILES="$(git diff --name-only origin/master...HEAD -- 'backend/resources/js/**/*.vue' 'backend/resources/js/**/*.ts' 'backend/resources/js/**/*.js' 'backend/vite.config.js' 'backend/vite.config.ts' | sed 's#^backend/##' | grep -E '\.(vue|ts|js)$' || true)"
            if [ -z "$FILES" ]; then
              echo "No changed frontend files compared with master; skipping ESLint."
              exit 0
            fi
            printf 'Frontend files checked by ESLint:\n%s\n' "$FILES"
            cd backend
            pnpm exec eslint $FILES

workflows:
  playrke-ci:
    jobs:
      - backend-php
      - backend-assets
