# ============================================
# Docker Compose - PlayRKE Monorepo (Optimizado)
# ============================================

services:

  # ==========================================
  # MySQL Database
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: playrke-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-playrke}
      MYSQL_USER: ${DB_USERNAME:-playrke}
      MYSQL_PASSWORD: ${DB_PASSWORD:-playrke}
      MYSQL_INITDB_SKIP_TZINFO: 1
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/init:/docker-entrypoint-initdb.d
    command:
      - --authentication_policy=caching_sha2_password
      - --host_cache_size=0
    networks:
      - playrke-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================
  # PostgreSQL Database (for trivia domain)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: playrke-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trivia}
      POSTGRES_USER: ${POSTGRES_USER:-trivia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trivia}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - playrke-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================
  # Redis Cache & Queue
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: playrke-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - playrke-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # Laravel Backend
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: playrke-backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    ports:
      - "${APP_PORT:-8001}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: PlayRKE
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-playrke}
      DB_USERNAME: ${DB_USERNAME:-playrke}
      DB_PASSWORD: ${DB_PASSWORD:-playrke}
      DB_TRIVIA_HOST: postgres
      DB_TRIVIA_PORT: 5432
      DB_TRIVIA_DATABASE: trivia
      DB_TRIVIA_USERNAME: trivia
      DB_TRIVIA_PASSWORD: trivia
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REVERB_APP_ID: ${REVERB_APP_ID:-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-local}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-local}
      REVERB_HOST: backend
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    networks:
      - playrke-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 120s
    command: >
      sh -c "
        if [ ! -f vendor/autoload.php ]; then
          composer install --no-interaction --prefer-dist --optimize-autoloader;
        fi;
        php artisan migrate --force;
        php artisan serve --host=0.0.0.0 --port=8000
      "

  # ==========================================
  # Laravel Reverb Server
  # ==========================================
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: playrke-reverb
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    ports:
      - "${REVERB_PORT:-8082}:8080"
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      REVERB_APP_ID: ${REVERB_APP_ID:-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-local}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-local}
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 8080
      REDIS_HOST: redis
    networks:
      - playrke-network
    command: >
      sh -c "
        sleep 5;
        php artisan reverb:start --host=0.0.0.0 --port=8080
      "

  # ==========================================
  # Nuxt 4 Frontend
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
      args:
        NODE_ENV: development
    container_name: playrke-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_nuxt:/app/.nuxt
      - frontend_output:/app/.output
    ports:
      - "${FRONTEND_PORT:-3002}:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8000/api}
      NUXT_PUBLIC_WS_URL: ${NUXT_PUBLIC_WS_URL:-ws://localhost:8080}
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_TELEMETRY_DISABLED: 1
    networks:
      - playrke-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 180s
    command: >
      sh -c "
        if [ ! -d node_modules/.pnpm ]; then pnpm install; fi;
        pnpm run dev --hostname 0.0.0.0
      "

  # ==========================================
  # pgAdmin (PostgreSQL management)
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: playrke-pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-8084}:80"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@trivia.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - playrke-network

  # ==========================================
  # PhpMyAdmin
  # ==========================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: playrke-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8083}:80"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    networks:
      - playrke-network

  # ==========================================
  # Queue Worker
  # ==========================================
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: playrke-queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    depends_on:
      backend:
        condition: service_healthy
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: playrke
      DB_USERNAME: playrke
      DB_PASSWORD: playrke
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    networks:
      - playrke-network
    command: >
      sh -c "
        sleep 5;
        php artisan queue:work --tries=3 --timeout=90 --sleep=3
      "

# ==========================================
# Volumes
# ==========================================
volumes:
  mysql_data:
  postgres_data:
  pgadmin_data:
  redis_data:
  backend_vendor:
  frontend_node_modules:
  frontend_nuxt:
  frontend_output:

# ==========================================
# Network
# ==========================================
networks:
  playrke-network:
    driver: bridge
