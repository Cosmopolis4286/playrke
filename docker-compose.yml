version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: playrke-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: playrke
      MYSQL_USER: playrke
      MYSQL_PASSWORD: playrke
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - playrke-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: playrke-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - playrke-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: playrke-backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./backend/storage:/var/www/storage
    ports:
      - "8000:8000"
      - "8080:8080"  # Laravel Reverb
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: playrke
      DB_USERNAME: playrke
      DB_PASSWORD: playrke
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - playrke-network
    command: >
      sh -c "php artisan serve --host=0.0.0.0 --port=8000"

  # Nuxt Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: playrke-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8000/api
      NODE_ENV: development
    networks:
      - playrke-network
    command: pnpm run dev

  # PhpMyAdmin (opcional, para administrar la BD)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: playrke-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    networks:
      - playrke-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  playrke-network:
    driver: bridge
