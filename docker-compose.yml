services:

  mysql:
    image: mysql:8.0
    container_name: playrke-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-playrke}
      MYSQL_USER: ${DB_USERNAME:-playrke}
      MYSQL_PASSWORD: ${DB_PASSWORD:-playrke}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/init:/docker-entrypoint-initdb.d
    networks:
      - playrke-network

  redis:
    image: redis:7-alpine
    container_name: playrke-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - playrke-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: playrke-backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    ports:
      - "${APP_PORT:-8001}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: true
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: playrke
      DB_USERNAME: playrke
      DB_PASSWORD: playrke
      REDIS_HOST: redis
    networks:
      - playrke-network
    command: >
      sh -c "
        if [ ! -f vendor/autoload.php ]; then
          composer install --no-interaction --prefer-dist;
        fi;
        php artisan migrate --force;
        php artisan serve --host=0.0.0.0 --port=8000
      "

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: playrke-reverb
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    ports:
      - "${REVERB_PORT:-8082}:8080"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      APP_ENV: local
      REDIS_HOST: redis
    networks:
      - playrke-network
    command: >
      sh -c "
        sleep 5;
        php artisan reverb:start --host=0.0.0.0 --port=8080
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    container_name: playrke-frontend
    ports:
      - "3002:3000"
    networks:
      - playrke-network
    depends_on:
      backend:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: playrke-phpmyadmin
    restart: unless-stopped
    ports:
      - "8083:80"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
    networks:
      - playrke-network

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: playrke-queue
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - playrke-network
    command: >
      sh -c "
        sleep 5;
        php artisan queue:work --tries=3 --timeout=90 --sleep=3
      "

volumes:
  mysql_data:
  redis_data:
  backend_vendor:
  frontend_node_modules:


networks:
  playrke-network:
    driver: bridge
